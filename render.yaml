services:
  - type: web
    name: jaegr
    runtime: node
    plan: free # no payment information required; see the storage note below
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/scenarios
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NEXT_PUBLIC_SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_DEVNET_RPC_URL
        value: https://api.devnet.solana.com
      # Free instances have no persistent disk. /tmp is writable but ephemeral:
      # run history and execution evidence reset when the service restarts or
      # redeploys. Attach a disk on a paid plan for durable storage.
      - key: DATABASE_PATH
        value: /tmp/jaegr.db
      # Set these in the Render dashboard; never commit real keys.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
